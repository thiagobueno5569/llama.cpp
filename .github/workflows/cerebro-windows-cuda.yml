name: plastic MoE - Windows CUDA build

on:
  workflow_dispatch:
  push:
    branches: [cerebro]

permissions:
  contents: write

concurrency:
  group: cerebro-build
  cancel-in-progress: true

jobs:
  windows-cuda:
    runs-on: windows-2022
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON ^
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75;86;89" -DGGML_RPC=ON -DGGML_CUDA_CCCL_VERSION=v3.4.3 ^
            -DLLAMA_BUILD_BORINGSSL=ON -DLLAMA_BUILD_TESTS=OFF
          if errorlevel 1 exit /b 1
          cmake --build build -j %NUMBER_OF_PROCESSORS% --target llama-server llama-perplexity llama-completion llama-bench ggml-rpc-server
          if errorlevel 1 exit /b 1

      - name: Pack
        run: |
          New-Item -ItemType Directory pack | Out-Null
          Copy-Item .\build\bin\*.exe, .\build\bin\*.dll pack\
          Copy-Item "$env:CUDA_PATH\bin\cudart64_12.dll", "$env:CUDA_PATH\bin\cublas64_12.dll", "$env:CUDA_PATH\bin\cublasLt64_12.dll" pack\
          Get-ChildItem pack
          7z a llama-cerebro-win-cuda-12.4-x64.zip .\pack\*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "cerebro-${{ github.run_number }}"
          gh release create $tag llama-cerebro-win-cuda-12.4-x64.zip --target ${{ github.sha }} --title "plastic MoE build ${{ github.run_number }}" --notes "Windows x64, CUDA 12.4, sm_75+86+89, AVX2, RPC. Commit ${{ github.sha }}" --prerelease
