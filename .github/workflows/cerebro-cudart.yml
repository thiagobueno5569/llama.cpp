name: plastic MoE - CUDA runtime DLLs

on:
  push:
    branches: [cerebro]
    paths: [.github/workflows/cerebro-cudart.yml]

permissions:
  contents: write

jobs:
  cudart:
    runs-on: windows-2022
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Pack and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory rt | Out-Null
          Copy-Item "$env:CUDA_PATH\bin\cudart64_12.dll", "$env:CUDA_PATH\bin\cublas64_12.dll", "$env:CUDA_PATH\bin\cublasLt64_12.dll" rt\
          Get-ChildItem rt
          7z a cudart-win-cuda-12.4-x64.zip .\rt\*
          gh release upload cerebro-6 cudart-win-cuda-12.4-x64.zip --clobber
